services:
  - type: web
    name: lexis-intelligence-api
    runtime: python
    region: oregon
    plan: starter          # $7/mo — needed for ML models (512MB RAM)
    # Build the article index + download the ONNX models at build time so boot is fast.
    buildCommand: pip install -r backend/requirements.txt && python -m backend.app.services.constitution_rag
    startCommand: python start.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false        # Set to your Vercel URL after deploying frontend
      - key: DATASET_NAME
        value: moonmelonpizza/constitution_of_india
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: RAG_MODE
        value: full         # set to "lite" if the instance runs out of memory
      - key: PRELOAD_RAG
        value: "true"
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false        # Set to your Vercel URL e.g. https://lexis-intelligence.vercel.app
